name: Process XBPS repositories

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tag dipisah spasi, atau "all"'
        default: all
        type: string
  schedule:
    - cron: '23 */6 * * *'   # cadangan; no-op kalau tak ada yang perlu diproses

# Minimal: default hanya baca. Tiap job menaikkan sendiri sesuai kebutuhan nyata.
permissions:
  contents: read

concurrency:
  group: repo-process
  cancel-in-progress: false

env:
  ALL_TAGS: 'x86_64 x86_64-musl aarch64 aarch64-musl armv6l armv6l-musl armv7l armv7l-musl i686'

jobs:
  # 0. tag idempotent. Tanpa secret, tanpa template.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # gh release create (idempotent)
    outputs:
      tags: ${{ steps.t.outputs.tags }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IN: ${{ inputs.tags || 'all' }}
        run: |
          set -euo pipefail
          sel="$IN"
          if [ "$sel" = all ]; then sel="$ALL_TAGS"; fi
          out=""
          for t in $sel; do
            case " $ALL_TAGS " in
              *" $t "*) out="$out $t" ;;
              *) echo "::warning::tag asing diabaikan: $t" ;;
            esac
          done
          out=$(echo $out | xargs -n1 | sort -u | xargs)
          if [ -z "$out" ]; then echo "tidak ada tag valid"; exit 1; fi
          for t in $out; do
            if ! gh release view "$t" >/dev/null 2>&1; then
              gh release create "$t" --prerelease \
                --title "repository T4nOS for $t" \
                --notes "XBPS repository untuk $t. Dikelola otomatis oleh CI — jangan edit manual."
            fi
          done
          echo "tags=$(echo "$out" | jq -Rc 'split(" ")')" >> "$GITHUB_OUTPUT"

  # 1. index + sign + prune. PEGANG SECRET, TIDAK BACA TEMPLATE.
  process:
    needs: prepare
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write        # upload repodata/.sig2 + hapus asset lama (gh release)
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.prepare.outputs.tags) }}
    container:
      # Pin: set variabel repo VOID_IMAGE_TAG ke tag bertanggal dari
      # ghcr.io/void-linux/void-glibc-full (Settings → Variables). Selama belum diset,
      # jatuh ke 'latest' (TIDAK terpin) — tag valid tidak bisa diverifikasi dari sandbox.
      image: ghcr.io/void-linux/void-glibc-full:${{ vars.VOID_IMAGE_TAG || 'latest' }}
      env:
        PATH: '/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin'
    steps:
      - name: Install tools
        run: |
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y bash git tar bsdtar python3 github-cli curl jq coreutils grep sed findutils
      - name: Checkout (hanya script CI — template sengaja tidak diambil)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: .github/workflows
          persist-credentials: false   # job pemegang secret: token tidak ditinggal di .git/config
      - name: Process tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          SIGNEDBY: 'T4n Labs'
        run: bash .github/workflows/process-tag.sh

  # 2. packages.json. BACA TEMPLATE, TANPA SECRET.
  json:
    needs: [prepare, process]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read         # baca release/asset + checkout; membaca template, TANPA secret & tanpa tulis
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.prepare.outputs.tags) }}
    container:
      # Pin: set variabel repo VOID_IMAGE_TAG ke tag bertanggal dari
      # ghcr.io/void-linux/void-glibc-full (Settings → Variables). Selama belum diset,
      # jatuh ke 'latest' (TIDAK terpin) — tag valid tidak bisa diverifikasi dari sandbox.
      image: ghcr.io/void-linux/void-glibc-full:${{ vars.VOID_IMAGE_TAG || 'latest' }}
      env:
        PATH: '/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin'
    steps:
      - name: Install tools
        run: |
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y bash git tar bsdtar python3 github-cli curl jq zstd
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Ambil repodata + daftar asset
        shell: bash          # container Void: tanpa ini `run` memakai sh (tidak kenal pipefail)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          rid=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)
          gh api --paginate "repos/$GH_REPO/releases/$rid/assets" > assets.pages
          jq -s 'add // []' assets.pages > assets.json
          if gh release download "$TAG" -p "$TAG-repodata" -D . --clobber 2>/dev/null; then
            bsdtar -xOf "$TAG-repodata" index.plist > index.plist 2>/dev/null \
              || tar --zstd -xOf "$TAG-repodata" index.plist > index.plist
          fi
      - name: Generate packages.json
        env:
          TAG: ${{ matrix.tag }}
        run: python3 .github/workflows/gen-json.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: json-${{ matrix.tag }}
          path: json/${{ matrix.tag }}/packages.json
          if-no-files-found: error
          retention-days: 3

  # 3. commit json/** sekali saja
  commit:
    needs: [prepare, json]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # git push json/**
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: json-*
          path: json-artifacts
      - name: Commit json
        run: |
          set -euo pipefail
          found=0
          for d in json-artifacts/json-*; do
            [ -f "$d/packages.json" ] || continue
            tag="${d##*/json-}"
            mkdir -p "json/$tag"
            cp "$d/packages.json" "json/$tag/packages.json"
            found=1
          done
          if [ "$found" != 1 ]; then echo "tidak ada json dihasilkan"; exit 0; fi
          git config user.name  "t4n-bot"
          git config user.email "actions@users.noreply.github.com"
          git add json
          if git diff --cached --quiet; then echo "json tidak berubah"; exit 0; fi
          git commit -m "chore(json): update index [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 5
          done
          echo "::warning::commit json gagal setelah 3 percobaan"